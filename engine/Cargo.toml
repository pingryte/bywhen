[package]
name = "bywhen-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ByWhen's local-first, calendar-aware goal calculation engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"

[dev-dependencies]
proptest = "1"
